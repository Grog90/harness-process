name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    name: ci
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify signed commit
        run: |
          git config --global gpg.format ssh
          if ("${{ github.event_name }}" -eq "pull_request") {
            git fetch origin "${{ github.base_ref }}" --depth=1
            if ($LASTEXITCODE -ne 0) { exit 1 }
            $content = git show FETCH_HEAD:.github/allowed_signers
            if ($LASTEXITCODE -ne 0) { exit 1 }
            $signers = Join-Path $env:RUNNER_TEMP "allowed_signers"
            $content | Set-Content -LiteralPath $signers -Encoding utf8
            $ref = "${{ github.event.pull_request.head.sha }}"
            $range = "FETCH_HEAD..$ref"
          } else {
            $before = "${{ github.event.before }}"
            $signers = Join-Path $env:RUNNER_TEMP "allowed_signers"
            if ($before -match "^0+$") {
              $signers = "${{ github.workspace }}/.github/allowed_signers"
            } else {
              git cat-file -e "${before}:.github/allowed_signers" 2>$null
              if ($LASTEXITCODE -ne 0) {
                # bootstrap: в before файла ещё нет, доверяем текущему дереву один раз
                $signers = "${{ github.workspace }}/.github/allowed_signers"
              } else {
                $content = git show "${before}:.github/allowed_signers"
                if ($LASTEXITCODE -ne 0) { exit 1 }
                $content | Set-Content -LiteralPath $signers -Encoding utf8
              }
            }
            $ref = "HEAD"
            $range = "$before..HEAD"
          }
          git config --global gpg.ssh.allowedSignersFile $signers
          $revs = @()
          if ($range -notmatch "^0+\.\.") {
            $revs = git rev-list $range
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          if ($revs.Count -eq 0) { $revs = @($ref) }
          foreach ($rev in $revs) { git verify-commit $rev; if ($LASTEXITCODE -ne 0) { exit 1 } }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Unit tests
        env:
          HARNESS_SIGNING_REF: ${{ github.event.pull_request.head.sha || 'HEAD' }}
        run: python -m unittest discover -s tests -q
      - name: Harness CI (selftest, coverage, metrics)
        run: python -m harness ci --report evidence/ci/report.json
      - name: Rules have not drifted
        run: python -m harness rule verify
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign CI evidence (keyless)
        run: cosign sign-blob --yes --bundle evidence/ci/report.json.bundle evidence/ci/report.json
      - name: Verify CI evidence signature
        run: >-
          cosign verify-blob
          --bundle evidence/ci/report.json.bundle
          --certificate-identity-regexp "https://github.com/Grog90/harness-process/.*"
          --certificate-oidc-issuer https://token.actions.githubusercontent.com
          evidence/ci/report.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-ci-evidence
          path: evidence/ci
          if-no-files-found: warn
