name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Unit tests
        run: python -m unittest discover -s tests -q
      - name: Harness CI (selftest, coverage, metrics)
        run: python -m harness ci --report evidence/ci/report.json
      - name: Rules have not drifted
        run: python -m harness rule verify
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-ci-evidence
          path: evidence/ci
          if-no-files-found: warn
