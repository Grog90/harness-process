        id: process-qa
        name: Process QA
        description: Verification — cases and tests, no service code.
        order: 13
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: Ты QA. Готовишь проверяемые сценарии и тесты, запускаешь проверки на точных версиях; код сервисов не меняешь.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              customSkillDirs:
                - 'C:/Users/ownag/OneDrive/Документы/deepseek-harness/default-workspace/skills'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
    - id: preset-process-verifier
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: process-verifier
        name: Process verifier
        description: Independent review — read-only product, verdict in evidence.
        order: 14
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: Ты независимый проверяющий. Продукт только читаешь, вердикт и доказательства пишешь в evidence; правок кода не делаешь.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
