# Процессные пресеты harness.
#
# Каждый пресет — композиция инструментов для одной роли процесса. Права на пути
# всё равно проверяет harness-guard по policies/policy.json и активной области
# задачи; пресет только не даёт лишних инструментов.
#
# Скиллы процесса лежат в каталоге skills/ этого рабочего каталога.
- insert:
    - id: preset-process-ba
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: process-ba
        name: Process BA
        description: Business analysis — proposal, specs, questions, no code.
        order: 10
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: Ты бизнес-аналитик. Формулируешь наблюдаемые правила, границы и вопросы; код не пишешь.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              customSkillDirs:
                - 'C:/Users/ownag/OneDrive/Документы/deepseek-harness/default-workspace/skills'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
    - id: preset-process-sa
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: process-sa
        name: Process SA
        description: System analysis — design, contracts, tasks, no code.
        order: 11
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: Ты системный аналитик. Проверяешь архитектуру по коду, согласуешь контракты и задачи; код сервисов не правишь.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              customSkillDirs:
                - 'C:/Users/ownag/OneDrive/Документы/deepseek-harness/default-workspace/skills'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
    - id: preset-process-dev
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: process-dev
        name: Process DEV
        description: Implementation — code and tests inside allowed_files.
        order: 12
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: Ты разработчик. Работаешь только в allowed_files брифа, пишешь код и тесты; спеку и дизайн не правишь.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              customSkillDirs:
                - 'C:/Users/ownag/OneDrive/Документы/deepseek-harness/default-workspace/skills'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
    - id: preset-process-qa
      name: '@deepseek-ai/dsh-agent-preset'
